name: Freikatalog

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      nur:
        description: 'Nur diese Quellen (z. B. plutotv,joynfree), leer = alle'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: freikatalog
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sammeln:
    runs-on: ${{ vars.KATALOG_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - name: Repo holen
        uses: actions/checkout@v4

      - name: Python einrichten
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scraper holen
        env:
          SCRAPER_REPO: ${{ vars.SCRAPER_REPO || 'Chrisophy/scraper' }}
          SCRAPER_TOKEN: ${{ secrets.SCRAPER_TOKEN }}
        run: |
          rm -rf _scraper
          if [ -n "$SCRAPER_TOKEN" ]; then
            ADR="https://x-access-token:${SCRAPER_TOKEN}@github.com/${SCRAPER_REPO}.git"
          else
            ADR="https://github.com/${SCRAPER_REPO}.git"
          fi
          git clone --quiet --depth 1 "$ADR" _scraper || mkdir -p _scraper
          mkdir -p scraper

      - name: Alten Stand holen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf _alt
          git clone --quiet --depth 1 --branch daten "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" _alt || mkdir -p _alt

      - name: Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: .profil
          key: profil-${{ github.run_id }}
          restore-keys: profil-

      - name: Standort prüfen
        env:
          KATALOG_PROXY: ${{ secrets.KATALOG_PROXY }}
        run: |
          DIREKT=$(curl -s -m 15 https://ipinfo.io/country || true)
          echo "Ohne Proxy: ${DIREKT:-unbekannt}"
          {
            echo '## Standort des Laufs'
            echo ''
            echo "Ohne Proxy: ${DIREKT:-unbekannt}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$KATALOG_PROXY" ]; then
            MITPROXY=$(curl -s -m 20 -x "$KATALOG_PROXY" https://ipinfo.io/country || true)
            echo "Mit Proxy: ${MITPROXY:-fehlgeschlagen}"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Mit Proxy: ${MITPROXY:-fehlgeschlagen}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Kein Proxy hinterlegt"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Kein Proxy hinterlegt (KATALOG_PROXY ist leer)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sammeln
        env:
          KATALOG_PROXY: ${{ secrets.KATALOG_PROXY }}
          NUR: ${{ github.event.inputs.nur }}
        run: |
          PY=$(command -v python3 || command -v python)
          rm -rf _neu _arbeit
          "$PY" sammler/sammeln.py --scraper scraper _scraper --alt _alt/katalog --aus _neu/katalog --profil .profil --arbeit _arbeit --nur "$NUR"

      - name: Protokolle sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protokolle
          path: _arbeit/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Veröffentlichen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _neu
          printf '# Freikatalog-Daten\n\nAutomatisch erzeugt, nicht von Hand ändern.\n' > README.md
          git init --quiet
          git checkout --quiet -b daten
          git config user.name "katalog-bot"
          git config user.email "katalog-bot@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Katalog $(date -u +%Y-%m-%d)"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" daten
